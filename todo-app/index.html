<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple To-Do</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>To-Do</h1>

    <form id="todo-form" class="todo-form">
      <input
        id="todo-input"
        type="text"
        placeholder="What needs doing?"
        autocomplete="off"
        maxlength="200"
        aria-label="New task"
      />
      <button type="submit">Add</button>
    </form>

    <div class="filters" role="group" aria-label="Filter tasks">
      <button type="button" class="filter active" data-filter="all">All</button>
      <button type="button" class="filter" data-filter="active">Active</button>
      <button type="button" class="filter" data-filter="completed">Completed</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <footer class="footer">
      <span id="todo-count">0 items left</span>
      <button type="button" id="clear-completed" class="link-button">Clear completed</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
